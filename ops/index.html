<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ops · Tracy Harris Co Brand Kit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="../assets/fonts/editors-note-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/editors-note-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/fonts.css" />
  <link rel="stylesheet" href="../styles/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--f-sans);
      background: var(--p-oatmeal);
      color: var(--ink-body);
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: var(--sp-8) var(--sp-5) var(--sp-10);
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--sp-5);
      margin-bottom: var(--sp-7);
      padding-bottom: var(--sp-5);
      border-bottom: 1px solid var(--border-hairline);
      flex-wrap: wrap;
    }
    .header__back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--ink-mute);
      text-decoration: none;
    }
    .header__back:hover { color: var(--ink-heading); }
    .eyebrow {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin: 0 0 var(--sp-4) 0;
    }
    h1 {
      font-family: var(--f-serif-display);
      font-size: clamp(40px, 5.5vw, 68px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 0 var(--sp-4) 0;
      color: var(--ink-heading);
    }
    h1 em { font-family: var(--f-serif-italic); font-style: italic; }
    .intro {
      font-size: 16px;
      line-height: 1.6;
      max-width: 62ch;
      margin: 0;
      color: var(--ink-body);
    }
    .meta {
      font-size: 12px;
      color: var(--ink-mute);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      margin-top: 10px;
    }

    /* ---------- Section scaffold ---------- */
    .section {
      margin-bottom: var(--sp-8);
    }
    .section__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--sp-4);
      margin-bottom: var(--sp-5);
      padding-bottom: var(--sp-4);
      border-bottom: 1px solid var(--border-hairline);
    }
    .section__title {
      font-family: var(--f-serif-display);
      font-size: 32px;
      font-weight: 400;
      color: var(--ink-heading);
      margin: 0;
      line-height: 1.1;
    }
    .section__title em { font-family: var(--f-serif-italic); font-style: italic; }
    .section__count {
      font-size: 11px;
      color: var(--ink-mute);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* ---------- Status pills ---------- */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      border: 1px solid var(--border-hairline);
      background: transparent;
      color: var(--ink-mute);
      white-space: nowrap;
    }
    .pill--in_progress { background: var(--p-sage); color: var(--p-white); border-color: var(--p-sage); }
    .pill--pending     { background: transparent; color: var(--p-aztek); border-color: var(--p-aztek); }
    .pill--queued      { background: transparent; color: var(--ink-mute); border-color: var(--border-hairline); }
    .pill--concept     { background: transparent; color: var(--p-gold-dark); border-color: var(--p-gold-mid); }
    .pill--dont_build  { background: transparent; color: var(--p-mute); border-color: var(--p-mute); text-decoration: line-through; }

    /* ---------- Task rows ---------- */
    .rows {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .row {
      background: var(--p-white);
      border: 1px solid var(--border-hairline);
      padding: var(--sp-4) var(--sp-5);
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .row + .row { border-top: 0; }
    .row:first-child { border-top-left-radius: var(--r-md); border-top-right-radius: var(--r-md); }
    .row:last-child  { border-bottom-left-radius: var(--r-md); border-bottom-right-radius: var(--r-md); }
    .row:hover { border-color: var(--p-sage); box-shadow: 0 2px 8px rgba(16,16,16,0.04); position: relative; z-index: 2; }

    .row__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--sp-4);
      margin-bottom: 4px;
    }
    .row__subject {
      font-family: var(--f-sans);
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-heading);
      margin: 0;
      line-height: 1.3;
    }
    .row__id {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      color: var(--ink-mute);
      margin-right: 8px;
      vertical-align: 1px;
    }
    .row__note {
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink-body);
      margin: 6px 0 0;
    }
    .row__waiting {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--ink-mute);
      font-family: var(--f-sans);
      margin-top: 8px;
    }
    .row__waiting-label {
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--p-aztek);
    }

    /* ---------- Ideas variant ---------- */
    .idea__summary {
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink-body);
      margin: 6px 0 0;
    }
    .idea__meta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--ink-mute);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 8px;
    }
    .idea__meta span + span::before {
      content: "·";
      margin-right: 8px;
      color: var(--border-hairline);
    }

    /* ---------- Empty + error ---------- */
    .empty {
      background: var(--p-white);
      border: 1px dashed var(--border-hairline);
      padding: var(--sp-6);
      border-radius: var(--r-md);
      font-size: 13px;
      color: var(--ink-mute);
      text-align: center;
    }

    @media (max-width: 640px) {
      .wrap { padding: var(--sp-6) var(--sp-4) var(--sp-8); }
      .section__title { font-size: 26px; }
      .row__top { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body data-brand="tracy">
  <div class="wrap">
    <div class="header">
      <div>
        <p class="eyebrow">Operations</p>
        <h1>What's in <em>motion</em>.</h1>
        <p class="intro">Running list of in-flight work and captured ideas. Updated as things ship, land, or arrive from the ideas channel. One URL to bookmark so nothing falls off the radar.</p>
      </div>
      <div style="text-align:right;">
        <a class="header__back" href="../index.html">&larr; Brand kit catalog</a>
        <div class="meta" id="metaUpdated"></div>
      </div>
    </div>

    <!-- In-flight -->
    <section class="section">
      <div class="section__head">
        <h2 class="section__title">In <em>motion</em></h2>
        <span class="section__count" id="tasksCount">Loading...</span>
      </div>
      <div class="rows" id="tasksList">
        <div class="empty">Loading tasks…</div>
      </div>
    </section>

    <!-- Ideas -->
    <section class="section">
      <div class="section__head">
        <h2 class="section__title">Ideas <em>inbox</em></h2>
        <span class="section__count" id="ideasCount">Loading...</span>
      </div>
      <div class="rows" id="ideasList">
        <div class="empty">Loading ideas…</div>
      </div>
    </section>
  </div>

  <script>
    const fmt = iso => {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    };
    const escapeHtml = s => String(s || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
    const pillClass = s => String(s || 'pending').toLowerCase().replace(/[^a-z0-9_]/g, '_');
    const pillLabel = s => {
      if (!s) return 'Pending';
      if (s === 'in_progress') return 'In progress';
      if (s.startsWith('research verdict')) return "Don't build";
      if (s.includes('flesh out')) return 'Concept';
      return s[0].toUpperCase() + s.slice(1);
    };

    function renderTasks(data) {
      const list = document.getElementById('tasksList');
      const count = document.getElementById('tasksCount');
      const tasks = data.tasks || [];
      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty">Nothing in motion right now.</div>';
        count.textContent = '0 active';
        return;
      }
      count.textContent = `${tasks.length} active`;
      list.innerHTML = tasks.map(t => {
        const waiting = t.waiting_on
          ? `<div class="row__waiting"><span class="row__waiting-label">Waiting on</span>&nbsp;${escapeHtml(t.waiting_on)}</div>`
          : '';
        const pClass = pillClass(t.status);
        const pText = pillLabel(t.status);
        return `
          <div class="row">
            <div class="row__top">
              <div style="min-width:0; flex:1;">
                <h3 class="row__subject">
                  <span class="row__id">#${escapeHtml(String(t.id))}</span>${escapeHtml(t.subject)}
                </h3>
              </div>
              <span class="pill pill--${pClass}">${pText}</span>
            </div>
            ${t.note ? `<p class="row__note">${escapeHtml(t.note)}</p>` : ''}
            ${waiting}
          </div>
        `;
      }).join('');
    }

    function renderIdeas(data) {
      const list = document.getElementById('ideasList');
      const count = document.getElementById('ideasCount');
      const ideas = data.ideas || [];
      if (ideas.length === 0) {
        list.innerHTML = '<div class="empty">No ideas captured yet.</div>';
        count.textContent = '0 captured';
        return;
      }
      count.textContent = `${ideas.length} captured`;
      list.innerHTML = ideas.map(i => {
        const pClass = pillClass(i.status);
        const pText = pillLabel(i.status);
        return `
          <div class="row">
            <div class="row__top">
              <div style="min-width:0; flex:1;">
                <h3 class="row__subject">
                  <span class="row__id">#${escapeHtml(String(i.id))}</span>${escapeHtml(i.title)}
                </h3>
              </div>
              <span class="pill pill--${pClass}">${pText}</span>
            </div>
            <p class="idea__summary">${escapeHtml(i.summary)}</p>
            <div class="idea__meta">
              ${i.captured ? `<span>Captured ${escapeHtml(fmt(i.captured))}</span>` : ''}
              ${i.complexity ? `<span>Complexity ${escapeHtml(i.complexity)}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // Live data lives on the webhook server — page auto-refreshes every
    // 30s so Karl sees updates without reload. Static JSON in repo is
    // a fallback if the webhook is ever down.
    const OPS_LIVE_URL = 'https://webhook.tracyharris.com.au/ops-state';

    async function load() {
      try {
        const res = await fetch(OPS_LIVE_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('live fetch failed');
        const data = await res.json();
        renderTasks(data.tasks || { tasks: [] });
        renderIdeas(data.ideas || { ideas: [] });
        const updated = (data.tasks && data.tasks.updated) || (data.ideas && data.ideas.updated);
        if (updated) {
          const d = new Date(updated);
          document.getElementById('metaUpdated').textContent =
            'Updated ' + d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' · live';
        }
      } catch (e) {
        console.warn('live fetch failed, falling back to static JSON', e);
        try {
          const [tasksRes, ideasRes] = await Promise.all([
            fetch('tasks.json', { cache: 'no-store' }),
            fetch('ideas.json', { cache: 'no-store' }),
          ]);
          const tasks = await tasksRes.json();
          const ideas = await ideasRes.json();
          renderTasks(tasks);
          renderIdeas(ideas);
          const updated = tasks.updated || ideas.updated;
          if (updated) {
            document.getElementById('metaUpdated').textContent = 'Static ' + fmt(updated);
          }
        } catch (e2) {
          console.error('static fallback also failed', e2);
          document.getElementById('tasksList').innerHTML = '<div class="empty">Couldn\'t load tasks. Refresh to retry.</div>';
          document.getElementById('ideasList').innerHTML = '<div class="empty">Couldn\'t load ideas. Refresh to retry.</div>';
        }
      }
    }

    load();
    // Poll every 30s so overnight progress shows up without a manual refresh
    setInterval(load, 30000);
    // Also refresh on tab-focus so returning to the tab shows latest state immediately
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  </script>
</body>
</html>
