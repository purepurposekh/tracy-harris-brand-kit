<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Brand Image · Tracy Harris Co Brand Kit</title>
  <meta name="description" content="Drop a photo in, get back a tagged sidecar JSON, the CDN URL, and a gallery entry." />
  <link rel="icon" type="image/svg+xml" href="../../assets/logos/tracy/tracy-brandmark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/fonts.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <!--
    Token rotation: the upload passphrase is the WEBHOOK_AUTH_TOKEN from
    /home/claude-bot/webhook-server/.env on the VPS. To rotate:
      1. Generate a new random hex string (e.g. `openssl rand -hex 32`)
      2. Update WEBHOOK_AUTH_TOKEN in /home/claude-bot/webhook-server/.env
      3. Restart webhook-server.service
      4. Anyone using this page must clear localStorage and re-enter the new token.
  -->
  <style>
    /* palette-scope-exempt: page is wrapped in data-brand="tracy" so primitive tokens resolve through the tracy semantic mappings */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--f-sans);
      background: var(--surface-elevated);
      color: var(--ink-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
    }
    a { color: inherit; }
    button { font-family: inherit; }

    /* Header (matches pages/images/) */
    .lib-top {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 18px clamp(20px, 4vw, 48px);
      background: var(--surface-elevated);
      border-bottom: 1px solid var(--border-hairline);
    }
    .lib-top__brand {
      display: inline-flex; align-items: baseline; gap: 12px;
      text-decoration: none;
      min-width: 0;
    }
    .lib-top__back {
      font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
      font-weight: 500; color: var(--ink-mute);
      white-space: nowrap;
    }
    .lib-top__title {
      font-family: var(--f-serif-display);
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--ink-heading);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 520px) {
      .lib-top__back { display: none; }
    }
    .lib-top__gallery {
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      font-weight: 500; color: var(--accent);
      text-decoration: none;
      padding: 8px 14px;
      border: 1px solid var(--accent-hover);
      border-radius: 999px;
      transition: background 180ms ease, color 180ms ease;
    }
    .lib-top__gallery:hover { background: var(--accent-hover); color: var(--ink-inverse); }

    /* Page wrap */
    .up-wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: clamp(24px, 4vw, 48px) clamp(20px, 4vw, 48px) 80px;
    }
    .up-intro { margin-bottom: 28px; }
    .up-intro h1 {
      font-family: var(--f-serif-display);
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--ink-heading);
      margin: 0 0 8px;
    }
    .up-intro p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink-mute);
      margin: 0;
      max-width: 60ch;
    }

    /* Token field */
    .up-token {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 24px;
      padding: 14px 16px;
      background: var(--surface-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: 8px;
    }
    .up-token__row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    @media (max-width: 520px) {
      .up-token__label { flex-basis: 100%; }
      .up-token__input { flex-basis: 100%; }
    }
    .up-token__label {
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      font-weight: 500; color: var(--ink-mute);
    }
    .up-token__input {
      flex: 1;
      padding: 8px 12px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      background: var(--surface-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 4px;
      color: var(--ink-body);
      min-width: 0;
    }
    .up-token__clear {
      background: transparent;
      border: 1px solid var(--border-hairline);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--ink-mute);
      cursor: pointer;
    }
    .up-token__clear:hover { color: var(--accent); border-color: var(--accent-hover); }
    .up-token__hint { font-size: 11px; color: var(--ink-mute); margin-top: 4px; }

    /* Dropzone */
    .up-drop {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      min-height: 220px;
      padding: 40px clamp(20px, 4vw, 48px);
      background: var(--surface-canvas);
      border: 2px dashed var(--border-hairline);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 180ms ease, background 180ms ease;
      text-align: center;
    }
    .up-drop:hover, .up-drop.is-hover {
      border-color: var(--accent);
      background: var(--surface-elevated);
    }
    .up-drop[data-busy="true"] { pointer-events: none; opacity: 0.5; }
    .up-drop__icon {
      width: 48px; height: 48px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      font-size: 24px;
      line-height: 1;
    }
    .up-drop__title {
      font-family: var(--f-serif-display);
      font-size: 20px;
      font-weight: 400;
      color: var(--ink-heading);
      margin: 0;
    }
    .up-drop__sub {
      font-size: 13px;
      color: var(--ink-mute);
      margin: 0;
    }
    .up-drop__caps {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin: 4px 0 0;
    }
    .up-drop input[type="file"] { display: none; }

    /* Queue + results */
    .up-list {
      display: flex; flex-direction: column;
      gap: 16px;
      margin-top: 24px;
    }
    .up-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 16px;
      padding: 16px;
      background: var(--surface-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: 10px;
    }
    @media (max-width: 600px) {
      .up-row { grid-template-columns: 1fr; }
    }
    .up-row__thumb {
      aspect-ratio: 3 / 4;
      background: var(--surface-elevated);
      border-radius: 6px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .up-row__thumb img { width: 100%; height: 100%; object-fit: cover; }
    .up-row__body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .up-row__name {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-heading);
      word-break: break-all;
      margin: 0;
    }
    .up-row__status {
      font-size: 12px;
      color: var(--ink-mute);
      margin: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .up-row__status[data-status="error"] { color: #b8533a; }
    .up-row__status[data-status="done"] { color: var(--accent); }
    .up-row__spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--border-hairline);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: up-spin 800ms linear infinite;
    }
    @keyframes up-spin { to { transform: rotate(360deg); } }

    /* Result block */
    .up-result { display: none; flex-direction: column; gap: 10px; }
    .up-row[data-status="done"] .up-result { display: flex; }
    .up-result__url {
      display: flex; gap: 8px; align-items: center;
    }
    .up-result__url code {
      flex: 1;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      padding: 6px 10px;
      background: var(--surface-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 4px;
      color: var(--accent);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .up-result__copy {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid var(--border-hairline);
      border-radius: 4px;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      font-weight: 500; color: var(--accent);
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease;
    }
    .up-result__copy:hover { background: var(--accent); color: var(--accent-on); }
    .up-result__copy.is-copied { background: var(--accent-hover); color: var(--ink-inverse); border-color: var(--accent-hover); }

    .up-result__meta { display: flex; flex-direction: column; gap: 8px; }
    .up-result__field { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
    .up-result__label {
      font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      font-weight: 500; color: var(--ink-mute);
      min-width: 60px;
    }
    .up-result__value { font-size: 12px; color: var(--ink-body); }
    .up-result__pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .up-result__pill {
      padding: 3px 10px;
      background: var(--surface-elevated);
      color: var(--accent);
      border-radius: 999px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .up-result__swatches { display: flex; gap: 6px; }
    .up-result__swatch {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 1px solid var(--border-hairline);
    }
    .up-result__score {
      display: inline-flex; align-items: baseline; gap: 4px;
    }
    .up-result__score-val {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }
    .up-result__gallery {
      display: inline-block;
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-hover);
    }
    .up-result__gallery:hover { color: var(--accent-hover); }
  </style>
</head>
<body data-brand="tracy">

  <header class="lib-top">
    <a class="lib-top__brand" href="../">
      <span class="lib-top__back">&larr; Brand Kit</span>
      <span class="lib-top__title">Upload Brand Image</span>
    </a>
    <a class="lib-top__gallery" href="../images/">View gallery</a>
  </header>

  <main class="up-wrap">
    <section class="up-intro">
      <h1>Drop a photo, get a tag, get a CDN URL.</h1>
      <p>The image gets tagged by Claude, stored in R2, and added to the gallery index. JPG, PNG, WebP, or HEIC. 25 MB max per file.</p>
    </section>

    <section class="up-token" id="tokenSection">
      <div class="up-token__row">
        <label class="up-token__label" for="tokenInput">Upload passphrase</label>
        <input type="password" id="tokenInput" class="up-token__input" autocomplete="off" placeholder="Paste your token" />
        <button type="button" class="up-token__clear" id="tokenClear" title="Clear saved token">Clear</button>
      </div>
      <p class="up-token__hint">Stored in this browser only (localStorage). Ask Karl for the current token.</p>
    </section>

    <label class="up-drop" id="dropzone" for="fileInput">
      <span class="up-drop__icon">&#43;</span>
      <p class="up-drop__title">Drop a photo here</p>
      <p class="up-drop__sub">or click to choose. Drag multiples to upload one after another.</p>
      <p class="up-drop__caps">JPG &middot; PNG &middot; WebP &middot; HEIC &middot; 25 MB max</p>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/heic" multiple />
    </label>

    <section class="up-list" id="uploadList"></section>
  </main>

  <script>
    // Posts to the CF Pages Function on this same origin so we bypass the
    // nginx 1 MB body-size limit on webhook.tracyharris.com.au. The Function
    // uploads the photo to R2 directly, then delegates tagging to the VPS via
    // a tiny JSON request. See functions/api/upload.ts.
    const ENDPOINT = '/api/upload';
    const TOKEN_KEY = 'thc.brandkit.uploadToken';

    const els = {
      tokenInput: document.getElementById('tokenInput'),
      tokenClear: document.getElementById('tokenClear'),
      dropzone: document.getElementById('dropzone'),
      fileInput: document.getElementById('fileInput'),
      list: document.getElementById('uploadList'),
    };

    // Token state
    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
    function setToken(t) {
      if (t) localStorage.setItem(TOKEN_KEY, t);
      else localStorage.removeItem(TOKEN_KEY);
    }
    els.tokenInput.value = getToken();
    els.tokenInput.addEventListener('change', () => setToken(els.tokenInput.value.trim()));
    els.tokenInput.addEventListener('blur',   () => setToken(els.tokenInput.value.trim()));
    els.tokenClear.addEventListener('click', () => {
      setToken('');
      els.tokenInput.value = '';
      els.tokenInput.focus();
    });

    // Drag-drop
    ['dragenter', 'dragover'].forEach(evt => {
      els.dropzone.addEventListener(evt, e => {
        e.preventDefault();
        els.dropzone.classList.add('is-hover');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      els.dropzone.addEventListener(evt, e => {
        e.preventDefault();
        els.dropzone.classList.remove('is-hover');
      });
    });
    els.dropzone.addEventListener('drop', e => {
      const files = Array.from(e.dataTransfer?.files || []);
      handleFiles(files);
    });
    els.fileInput.addEventListener('change', () => {
      const files = Array.from(els.fileInput.files || []);
      handleFiles(files);
      els.fileInput.value = '';
    });

    // Queue: process serially so we don't spawn 5 Claude CLI tagger jobs on the VPS at once
    const queue = [];
    let busy = false;

    function handleFiles(files) {
      const images = files.filter(f => /^image\//.test(f.type));
      if (!images.length) return;
      images.forEach(f => queue.push({ file: f, row: makeRow(f) }));
      drainQueue();
    }

    function makeRow(file) {
      const row = document.createElement('article');
      row.className = 'up-row';
      row.dataset.status = 'queued';
      const thumbUrl = URL.createObjectURL(file);
      row.innerHTML = `
        <div class="up-row__thumb"><img src="${thumbUrl}" alt="preview"/></div>
        <div class="up-row__body">
          <p class="up-row__name">${file.name}</p>
          <p class="up-row__status" data-status="queued"><span class="up-row__spinner"></span><span class="up-row__status-text">Queued.</span></p>
          <div class="up-result"></div>
        </div>
      `;
      els.list.prepend(row);
      return row;
    }

    function setStatus(row, status, text) {
      row.dataset.status = status;
      const el = row.querySelector('.up-row__status');
      el.dataset.status = status;
      row.querySelector('.up-row__status-text').textContent = text;
      const sp = el.querySelector('.up-row__spinner');
      if (status === 'done' || status === 'error') sp.style.display = 'none';
    }

    async function drainQueue() {
      if (busy) return;
      busy = true;
      els.dropzone.dataset.busy = 'true';
      while (queue.length) {
        const { file, row } = queue.shift();
        try {
          await uploadOne(file, row);
        } catch (err) {
          setStatus(row, 'error', 'Failed: ' + err.message);
        }
      }
      busy = false;
      els.dropzone.dataset.busy = 'false';
    }

    async function uploadOne(file, row) {
      const token = getToken();
      if (!token) {
        setStatus(row, 'error', 'No upload passphrase set. Enter it above and retry.');
        return;
      }

      setStatus(row, 'uploading', `Uploading ${file.name}...`);

      const fd = new FormData();
      fd.append('image', file);

      // The tag step on the server runs Claude vision, ~30-60s. Give the
      // browser a hint after upload bytes leave so the user knows.
      setTimeout(() => {
        if (row.dataset.status === 'uploading') {
          setStatus(row, 'uploading', 'Tagging via Claude (this takes about a minute)...');
        }
      }, 2500);

      let res;
      try {
        res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token },
          body: fd,
        });
      } catch (err) {
        throw new Error('Network error: ' + err.message);
      }

      if (res.status === 401) {
        setToken('');
        els.tokenInput.value = '';
        throw new Error('Unauthorized. Token cleared, paste a fresh one.');
      }
      if (res.status === 413) {
        throw new Error('File too large (server limit). Compress or pick a smaller file.');
      }
      if (!res.ok) {
        let detail = '';
        try { detail = (await res.json()).detail || (await res.json()).error || ''; } catch {}
        throw new Error(`HTTP ${res.status}${detail ? ': ' + detail : ''}`);
      }

      const data = await res.json();
      renderResult(row, data);
      setStatus(row, 'done', 'Tagged and stored.');
    }

    function paletteHex(name) {
      const map = {
        cream: '#ece7de', 'soft cream': '#ece7de', 'warm beige': '#d6c8b4',
        amber: '#c9a46c', 'dusty rose': '#cc9989', sage: '#788e75',
        'soft white': '#f6f4f1', white: '#ffffff', 'warm white': '#f6f4f1',
        oatmeal: '#f6f4f1', ink: '#313131', charcoal: '#101010',
        navy: '#20314c', orange: '#ca6b4d', peach: '#ddab7d',
        clay: '#ad765b', copper: '#ad765b', coral: '#ef673e',
        gold: '#c9a46c', 'gold-mid': '#c9a46c', mute: '#727272',
        green: '#6e8e77', moss: '#6e8e77', olive: '#788e75',
        terracotta: '#c87a5a', stone: '#c4bfb3', black: '#000000',
      };
      return map[String(name).toLowerCase().trim()] || '#e0d8c8';
    }

    function renderResult(row, data) {
      const t = data.tags || {};
      const mood = (t.mood || []).slice(0, 5);
      const palette = (t.palette || []).slice(0, 6);
      const useCases = (t.use_cases || []).slice(0, 6);
      const score = (t.on_brand_score ?? 0).toFixed(2);

      // Swap the local preview for the real CDN image so what the user sees is what's now in R2
      const cdnImg = row.querySelector('.up-row__thumb img');
      cdnImg.src = data.photo_url;
      cdnImg.alt = t.alt || data.filename;

      row.querySelector('.up-result').innerHTML = `
        <div class="up-result__url">
          <code title="${data.photo_url}">${data.photo_url}</code>
          <button type="button" class="up-result__copy" data-copy="${data.photo_url}">Copy URL</button>
        </div>
        <div class="up-result__meta">
          <div class="up-result__field">
            <span class="up-result__label">Score</span>
            <span class="up-result__score"><span class="up-result__score-val">${score}</span><span class="up-result__value">on-brand</span></span>
          </div>
          <div class="up-result__field">
            <span class="up-result__label">Mood</span>
            <div class="up-result__pills">${mood.map(m => `<span class="up-result__pill">${m}</span>`).join('')}</div>
          </div>
          <div class="up-result__field">
            <span class="up-result__label">Palette</span>
            <div class="up-result__swatches">${palette.map(p => `<span class="up-result__swatch" style="background:${paletteHex(p)}" title="${p}"></span>`).join('')}</div>
          </div>
          <div class="up-result__field">
            <span class="up-result__label">Subject</span>
            <span class="up-result__value">${t.subject || t.alt || ''}</span>
          </div>
          <div class="up-result__field">
            <span class="up-result__label">Use cases</span>
            <span class="up-result__value">${useCases.join(' · ')}</span>
          </div>
        </div>
        <a class="up-result__gallery" href="../images/#${encodeURIComponent(data.slug)}">View in gallery &rarr;</a>
      `;

      const copyBtn = row.querySelector('.up-result__copy');
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(data.photo_url).then(() => {
          copyBtn.classList.add('is-copied');
          copyBtn.textContent = 'Copied';
          setTimeout(() => {
            copyBtn.classList.remove('is-copied');
            copyBtn.textContent = 'Copy URL';
          }, 1500);
        });
      });
    }
  </script>
</body>
</html>
