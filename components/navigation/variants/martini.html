<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navigation — Martini variant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../styles/fonts.css" />
  <link rel="stylesheet" href="../../../styles/tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--f-sans);
      background: var(--p-cream);
      color: var(--p-charcoal);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* -------- TOP BAR -------- */
    .mnav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 22px 36px;
      gap: 24px;
      color: var(--p-charcoal);
      transition: background-color .3s ease, color .3s ease;
    }
    .mnav--dark { color: var(--p-oatmeal); }
    .mnav__group {
      display: flex;
      gap: 32px;
      align-items: center;
    }
    .mnav__group--right { justify-content: flex-end; }
    .mnav__link {
      font-family: var(--f-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: inherit;
      text-decoration: none;
      padding: 6px 2px;
      position: relative;
    }
    .mnav__link::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 2px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
    }
    .mnav__link:hover::after { transform: scaleX(1); }
    .mnav__mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
    }
    .mnav__mark svg { display: block; }
    .mnav__toggle {
      background: none;
      border: 0;
      cursor: pointer;
      padding: 8px;
      margin-left: 8px;
      color: inherit;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--f-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .mnav__toggle-icon {
      display: inline-block;
      width: 22px;
      height: 10px;
      position: relative;
    }
    .mnav__toggle-icon::before,
    .mnav__toggle-icon::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      height: 1.5px;
      background: currentColor;
      transition: transform .3s ease;
    }
    .mnav__toggle-icon::before { top: 0; }
    .mnav__toggle-icon::after { bottom: 0; }

    /* -------- FULL-SCREEN OVERLAY -------- */
    .mnav__overlay {
      position: fixed;
      inset: 0;
      background: var(--p-oatmeal);
      color: var(--p-charcoal);
      z-index: 60;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity .35s ease, transform .35s ease, visibility .35s;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow-y: auto;
    }
    body.mnav-open .mnav__overlay {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    body.mnav-open { overflow: hidden; }

    .mnav__overlay-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 22px 36px;
    }
    .mnav__close {
      background: none;
      border: 0;
      cursor: pointer;
      padding: 8px;
      color: var(--p-ffb-dark);
      justify-self: end;
      width: 36px; height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .mnav__close::before,
    .mnav__close::after {
      content: "";
      position: absolute;
      width: 22px; height: 1.5px;
      background: currentColor;
    }
    .mnav__close { position: relative; }
    .mnav__close::before { transform: rotate(45deg); }
    .mnav__close::after { transform: rotate(-45deg); }

    .mnav__overlay-body {
      display: grid;
      grid-template-columns: 1.1fr 1.1fr 0.9fr;
      gap: 64px;
      padding: 48px 80px 48px;
      align-self: center;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }
    .mnav__primary {
      display: flex;
      flex-direction: column;
    }
    .mnav__primary a {
      font-family: var(--f-serif-display);
      font-weight: 400;
      font-size: clamp(40px, 5.2vw, 68px);
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: var(--p-charcoal);
      text-decoration: none;
      padding: 18px 0;
      border-bottom: 1px solid rgba(16,16,16,0.12);
      transition: color .2s ease, transform .25s ease;
      display: inline-block;
      transform-origin: left;
    }
    .mnav__primary a:hover {
      color: var(--p-ffb-dark);
      transform: translateX(6px);
    }
    .mnav__secondary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 24px;
      align-content: start;
      padding-top: 24px;
    }
    .mnav__secondary a {
      font-family: var(--f-sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--p-charcoal);
      text-decoration: none;
      padding: 6px 0;
      transition: color .2s ease;
    }
    .mnav__secondary a:hover { color: var(--p-ffb-dark); }

    .mnav__tagline {
      font-family: var(--f-serif-display);
      font-size: clamp(18px, 1.6vw, 22px);
      line-height: 1.4;
      margin: 0;
      padding: 0 80px 48px;
      text-align: right;
      color: var(--p-charcoal);
    }
    .mnav__tagline em {
      font-style: italic;
      font-family: var(--f-serif-italic);
    }

    /* -------- DEMO BG (for preview) -------- */
    .demo-hero {
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(16,16,16,0.25) 0%, rgba(16,16,16,0) 30%, rgba(16,16,16,0.35) 100%),
        url("https://static.showit.co/1200/C8lYkDDfclRnqya_MiRFow/173187/062a3960.jpg") center/cover no-repeat;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 24px 8vh;
    }
    .demo-hero__word {
      color: var(--p-oatmeal);
      font-family: var(--f-serif-display);
      font-size: clamp(96px, 22vw, 320px);
      line-height: 0.9;
      margin: 0;
      letter-spacing: -0.02em;
    }

    /* Swap bar colors when scrolled past the hero */
    .mnav--scrolled {
      background: var(--p-oatmeal);
      color: var(--p-charcoal);
      box-shadow: 0 1px 0 rgba(16,16,16,0.06);
    }

    /* -------- MOBILE -------- */
    @media (max-width: 820px) {
      .mnav { padding: 16px 20px; grid-template-columns: auto 1fr auto; }
      .mnav__group:not(.mnav__group--right) { display: none; }
      .mnav__group--right .mnav__link { display: none; }

      .mnav__overlay-top { padding: 16px 20px; grid-template-columns: auto 1fr auto; }
      .mnav__overlay-body {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 16px 28px 40px;
      }
      .mnav__primary a {
        font-size: clamp(34px, 10vw, 52px);
        padding: 14px 0;
      }
      .mnav__secondary {
        grid-template-columns: 1fr 1fr;
        padding-top: 12px;
      }
      .mnav__tagline {
        padding: 0 28px 40px;
        text-align: left;
        font-size: 18px;
      }
    }
  </style>
</head>
<body data-brand="tracy">

  <nav class="mnav" id="mnav" aria-label="Primary">
    <div class="mnav__group">
      <a href="#home" class="mnav__link">Home</a>
      <a href="#about" class="mnav__link">About</a>
      <a href="#programs" class="mnav__link">Programs</a>
      <a href="#podcast" class="mnav__link">Podcast</a>
    </div>

    <a href="#home" class="mnav__mark" aria-label="Tracy Harris home">
      <svg width="36" height="44" viewBox="0 0 36 44" fill="none" aria-hidden="true">
        <line x1="8" y1="6" x2="28" y2="6" stroke="currentColor" stroke-width="1.6"/>
        <text x="18" y="36" text-anchor="middle" font-family="Playfair Display, Editors Note, serif" font-size="30" font-style="italic" fill="currentColor">T</text>
      </svg>
    </a>

    <div class="mnav__group mnav__group--right">
      <a href="#blog" class="mnav__link">Blog</a>
      <a href="#apply" class="mnav__link">Apply</a>
      <button class="mnav__toggle" type="button" aria-controls="mnav-overlay" aria-expanded="false" id="mnav-toggle">
        <span>Menu</span>
        <span class="mnav__toggle-icon" aria-hidden="true"></span>
      </button>
    </div>
  </nav>

  <div class="mnav__overlay" id="mnav-overlay" role="dialog" aria-modal="true" aria-label="Site menu">
    <div class="mnav__overlay-top">
      <span></span>
      <a href="#home" class="mnav__mark" aria-label="Tracy Harris home">
        <svg width="40" height="48" viewBox="0 0 36 44" fill="none" aria-hidden="true">
          <line x1="8" y1="6" x2="28" y2="6" stroke="currentColor" stroke-width="1.6"/>
          <text x="18" y="36" text-anchor="middle" font-family="Playfair Display, Editors Note, serif" font-size="30" font-style="italic" fill="currentColor">T</text>
        </svg>
      </a>
      <button class="mnav__close" type="button" aria-label="Close menu" id="mnav-close"></button>
    </div>

    <div class="mnav__overlay-body">
      <div class="mnav__primary">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#podcast">Podcast</a>
        <a href="#portfolio">Portfolio</a>
      </div>
      <div class="mnav__primary">
        <a href="#programs">Programs</a>
        <a href="#resources">Resources</a>
        <a href="#apply">Apply</a>
        <a href="#blog">Blog</a>
      </div>
      <div class="mnav__secondary">
        <a href="#speaking">Speaking</a>
        <a href="#newsletter">Newsletter</a>
        <a href="#fresh-quiz">FRESH Quiz</a>
        <a href="#free-guide">Free Guide</a>
        <a href="#youtube">YouTube</a>
        <a href="#tiktok">TikTok</a>
        <a href="#substack">My Substack</a>
        <a href="#instagram">Instagram</a>
      </div>
    </div>

    <p class="mnav__tagline">
      Freedom Filled® Business <em>for</em> women who want both.
    </p>
  </div>

  <!-- DEMO HERO so the nav has something to sit on top of -->
  <section class="demo-hero">
    <h1 class="demo-hero__word">Tracy</h1>
  </section>

  <script>
    const bar = document.getElementById('mnav');
    const toggle = document.getElementById('mnav-toggle');
    const close = document.getElementById('mnav-close');

    function openMenu() {
      document.body.classList.add('mnav-open');
      toggle.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
      document.body.classList.remove('mnav-open');
      toggle.setAttribute('aria-expanded', 'false');
    }
    toggle.addEventListener('click', openMenu);
    close.addEventListener('click', closeMenu);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('mnav-open')) closeMenu();
    });

    // Invert bar when off the hero (dark image) onto canvas
    bar.classList.add('mnav--dark');
    const io = new IntersectionObserver(([entry]) => {
      const onHero = entry.isIntersecting;
      bar.classList.toggle('mnav--dark', onHero);
      bar.classList.toggle('mnav--scrolled', !onHero);
    }, { threshold: 0.15, rootMargin: "-60px 0px 0px 0px" });
    io.observe(document.querySelector('.demo-hero'));
  </script>

</body>
</html>
