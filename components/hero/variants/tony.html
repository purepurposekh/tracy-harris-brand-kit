<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hero — Tony variant (bold stage hero + inline event widget)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../styles/fonts.css" />
  <link rel="stylesheet" href="../../../styles/tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--f-sans);
      background: var(--p-charcoal);
      color: var(--p-oatmeal);
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Tracy marks ---- */
    .t-mark { width: auto; fill: currentColor; display: block; }
    .t-mark path, .t-mark circle { fill: currentColor; }
    .t-wordmark { width: auto; fill: currentColor; display: block; }
    .t-wordmark path, .t-wordmark polygon, .t-wordmark rect, .t-wordmark circle { fill: currentColor; }

    /* -------- PAGE FRAME -------- */
    .tpage {
      background: var(--p-charcoal);
      min-height: 100vh;
      min-height: 100svh;
      padding: 16px;
      color: var(--p-oatmeal);
    }

    /* -------- THIN TOP BAR -------- */
    .tnav {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 24px;
      padding: 10px 12px 22px;
      color: var(--p-oatmeal);
    }
    .tnav__mark {
      color: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .tnav__mark .t-wordmark { height: 22px; }

    .tnav__links {
      display: flex;
      justify-content: center;
      gap: 36px;
      align-items: center;
    }
    .tnav__link {
      font-family: var(--f-sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--p-oatmeal);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: 0.92;
      transition: opacity .2s ease;
    }
    .tnav__link:hover { opacity: 1; }
    .tnav__link svg { opacity: 0.7; }

    .tnav__right {
      display: flex;
      align-items: center;
      gap: 18px;
      justify-content: flex-end;
    }
    .tnav__icon {
      background: none;
      border: 0;
      color: inherit;
      padding: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tnav__login {
      font-family: var(--f-sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--p-oatmeal);
      text-decoration: none;
    }
    .tnav__cta {
      padding: 10px 22px;
      border-radius: var(--r-pill);
      background: var(--p-oatmeal);
      color: var(--p-charcoal);
      font-family: var(--f-sans);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s ease, transform .2s ease;
      white-space: nowrap;
    }
    .tnav__cta:hover { background: #fff; transform: translateY(-1px); }

    /* -------- HERO STAGE -------- */
    .thero {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      min-height: 78vh;
      background: linear-gradient(135deg, #142421 0%, #1e3735 55%, #233635 100%);
      isolation: isolate;
      display: flex;
      flex-direction: column;
    }
    /* Portrait */
    .thero__image {
      position: absolute;
      inset: 0;
      background: url("../../../assets/photos/tracy-outfit8-39.jpg") center 22% / cover;
      z-index: 1;
      filter: saturate(0.9) contrast(1.05);
    }
    /* Sage/aztek wash — tints everything on-brand (replaces Tony's blue) */
    .thero__wash {
      position: absolute; inset: 0; z-index: 2;
      background:
        linear-gradient(135deg,
          rgba(30,55,53,0.55) 0%,
          rgba(30,55,53,0.25) 40%,
          rgba(110,142,119,0.30) 80%,
          rgba(30,55,53,0.55) 100%);
      mix-blend-mode: multiply;
    }
    /* Scan-line texture */
    .thero__lines {
      position: absolute; inset: 0; z-index: 3;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(246,244,241,0) 0px,
          rgba(246,244,241,0) 32px,
          rgba(246,244,241,0.045) 32px,
          rgba(246,244,241,0.045) 33px
        );
      mix-blend-mode: screen;
      pointer-events: none;
    }
    /* Soft edge vignette so corners feel deeper */
    .thero__vignette {
      position: absolute; inset: 0; z-index: 4;
      background:
        radial-gradient(ellipse 100% 80% at 50% 50%,
          rgba(0,0,0,0) 45%,
          rgba(0,0,0,0.35) 100%);
      pointer-events: none;
    }

    /* Content layer */
    .thero__body {
      position: relative;
      z-index: 5;
      flex: 1;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(28px, 4vw, 48px);
    }
    .thero__bottom {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 32px;
    }
    .thero__copy {
      max-width: 680px;
    }
    .thero__title {
      font-family: var(--f-sans);
      font-weight: 800;
      font-size: clamp(40px, 6.4vw, 96px);
      line-height: 0.98;
      letter-spacing: -0.02em;
      color: var(--p-oatmeal);
      margin: 0 0 24px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.25);
    }
    .thero__title span { display: block; }
    .thero__cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 28px;
      border-radius: var(--r-pill);
      background: var(--p-oatmeal);
      color: var(--p-charcoal);
      font-family: var(--f-sans);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s ease, transform .2s ease;
    }
    .thero__cta:hover { background: #fff; transform: translateY(-1px); }

    /* -------- INLINE EVENT WIDGET (bottom-right of hero) -------- */
    .tew {
      width: 300px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--p-charcoal);
      color: var(--p-oatmeal);
      box-shadow: 0 14px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .tew:hover { transform: translateY(-2px); box-shadow: 0 20px 40px rgba(0,0,0,0.45); }
    .tew__label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--p-oatmeal);
      opacity: 0.9;
    }
    .tew__label::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--p-sage);
      box-shadow: 0 0 0 0 rgba(110,142,119,0.6);
      animation: tewBlink 1.8s ease-in-out infinite;
    }
    @keyframes tewBlink {
      0%, 100% { box-shadow: 0 0 0 0 rgba(110,142,119,0.6); }
      50%      { box-shadow: 0 0 0 6px rgba(110,142,119,0); }
    }
    .tew__thumb {
      position: relative;
      aspect-ratio: 16 / 10;
      background: url("../../../assets/photos/tracy-outfit8-49.jpg") center 25% / cover;
      margin: 0 10px 10px;
      border-radius: 8px;
      overflow: hidden;
    }
    .tew__thumb::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(16,16,16,0) 50%, rgba(16,16,16,0.6) 100%);
    }
    .tew__caption {
      position: absolute;
      left: 10px; bottom: 10px;
      z-index: 2;
      font-family: var(--f-serif-display);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.1;
      color: var(--p-oatmeal);
      max-width: 70%;
    }
    .tew__caption em { font-family: var(--f-serif-italic); font-style: italic; }
    .tew__watch {
      position: absolute;
      right: 10px; bottom: 10px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px 6px 10px;
      border-radius: var(--r-pill);
      background: rgba(246,244,241,0.94);
      color: var(--p-charcoal);
      font-family: var(--f-sans);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* -------- MOBILE -------- */
    @media (max-width: 900px) {
      .tnav__links { display: none; }
      .tnav { padding-bottom: 14px; }
      .tnav__login { display: none; }
    }
    @media (max-width: 820px) {
      .tpage { padding: 10px; }
      .thero {
        min-height: 88vh;
        border-radius: 18px;
      }
      .thero__image { background-position: 65% 22%; }
      .thero__body { padding: 22px 18px; }
      .thero__bottom {
        grid-template-columns: 1fr;
        gap: 20px;
        align-items: start;
      }
      .thero__title {
        font-size: clamp(38px, 11vw, 64px);
      }
      .thero__cta { padding: 14px 22px; font-size: 13px; }
      .tew { width: 100%; max-width: 340px; }
      .tew__thumb { aspect-ratio: 16 / 9; }
    }

    @media (max-width: 380px) {
      .thero__title { font-size: 36px; }
    }
  </style>
</head>
