<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hero — Martini variant (full-bleed portrait)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../styles/fonts.css" />
  <link rel="stylesheet" href="../../../styles/tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--f-sans);
      background: var(--p-cream);
      color: var(--p-charcoal);
      -webkit-font-smoothing: antialiased;
    }

    /* -------- THIN TOP BAR (sits inside the hero) -------- */
    .mhero__nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 3;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 24px 40px;
      color: var(--p-oatmeal);
    }
    .mhero__nav-group {
      display: flex;
      gap: 34px;
      align-items: center;
    }
    .mhero__nav-group--right { justify-content: flex-end; }
    .mhero__nav-link {
      font-family: var(--f-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: inherit;
      text-decoration: none;
      position: relative;
      padding: 6px 0;
    }
    .mhero__nav-link::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 2px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
    }
    .mhero__nav-link:hover::after { transform: scaleX(1); }
    .mhero__nav-mark {
      color: inherit;
      text-decoration: none;
      display: inline-flex;
    }

    /* -------- THE HERO -------- */
    .mhero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 clamp(16px, 3vw, 48px) 0;
      background: var(--p-charcoal);
    }
    .mhero__image {
      position: absolute;
      inset: 0;
      background-image: url("https://static.showit.co/1200/C8lYkDDfclRnqya_MiRFow/173187/062a3960.jpg");
      background-size: cover;
      background-position: center 20%;
      filter: saturate(0.92) contrast(1.02);
      z-index: 1;
    }
    .mhero__image::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg,
          rgba(16,16,16,0.35) 0%,
          rgba(16,16,16,0.0) 28%,
          rgba(16,16,16,0.0) 55%,
          rgba(16,16,16,0.55) 100%);
    }
    .mhero__content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding-bottom: clamp(20px, 4vh, 48px);
      width: 100%;
      max-width: 1600px;
    }
    .mhero__word {
      font-family: var(--f-serif-display);
      font-weight: 400;
      font-size: clamp(96px, 22vw, 340px);
      line-height: 0.86;
      color: var(--p-oatmeal);
      margin: 0;
      letter-spacing: -0.02em;
      transform: translateY(6%);
    }
    .mhero__tagline {
      font-family: var(--f-sans);
      font-size: clamp(11px, 0.95vw, 13px);
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--p-oatmeal);
      margin: 20px 0 0;
      opacity: 0.92;
    }
    .mhero__tagline span { display: inline-block; }
    .mhero__tagline span + span::before {
      content: "·";
      margin: 0 12px;
      opacity: 0.6;
    }

    /* -------- SCROLL CUE -------- */
    .mhero__scroll {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 3;
      color: var(--p-oatmeal);
      font-family: var(--f-sans);
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* -------- EXHALE SECTION BELOW, for context -------- */
    .mexhale {
      padding: clamp(80px, 12vh, 140px) clamp(20px, 6vw, 80px);
      background: var(--p-cream);
      color: var(--p-charcoal);
      text-align: center;
    }
    .mexhale p {
      font-family: var(--f-serif-display);
      font-weight: 400;
      font-size: clamp(24px, 2.4vw, 32px);
      line-height: 1.45;
      letter-spacing: -0.005em;
      max-width: 720px;
      margin: 0 auto;
    }
    .mexhale em {
      font-family: var(--f-serif-italic);
      font-style: italic;
    }

    /* -------- MOBILE -------- */
    @media (max-width: 820px) {
      .mhero__nav { padding: 16px 20px; grid-template-columns: 1fr auto 1fr; }
      .mhero__nav-group:not(.mhero__nav-group--right) .mhero__nav-link:not(:first-child),
      .mhero__nav-group--right .mhero__nav-link { display: none; }
      .mhero__nav-group--right::after {
        content: "Menu";
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .mhero__word { font-size: clamp(72px, 26vw, 160px); }
      .mhero__tagline { font-size: 10px; letter-spacing: 0.28em; padding: 0 8px; }
      .mhero__tagline span + span::before { margin: 0 8px; }
    }
  </style>
</head>
<body data-brand="tracy">

  <section class="mhero">
    <div class="mhero__image" role="img" aria-label="Tracy Harris portrait"></div>

    <nav class="mhero__nav" aria-label="Primary">
      <div class="mhero__nav-group">
        <a href="#home" class="mhero__nav-link">Home</a>
        <a href="#about" class="mhero__nav-link">About</a>
        <a href="#programs" class="mhero__nav-link">Programs</a>
        <a href="#podcast" class="mhero__nav-link">Podcast</a>
      </div>

      <a href="#home" class="mhero__nav-mark" aria-label="Tracy Harris home">
        <svg width="36" height="44" viewBox="0 0 36 44" fill="none" aria-hidden="true">
          <line x1="8" y1="6" x2="28" y2="6" stroke="currentColor" stroke-width="1.6"/>
          <text x="18" y="36" text-anchor="middle" font-family="Playfair Display, Editors Note, serif" font-size="30" font-style="italic" fill="currentColor">T</text>
        </svg>
      </a>

      <div class="mhero__nav-group mhero__nav-group--right">
        <a href="#resources" class="mhero__nav-link">Resources</a>
        <a href="#blog" class="mhero__nav-link">Blog</a>
        <a href="#apply" class="mhero__nav-link">Apply</a>
      </div>
    </nav>

    <div class="mhero__content">
      <h1 class="mhero__word">Tracy</h1>
      <p class="mhero__tagline">
        <span>Freedom Filled® Business</span>
        <span>for Women Building by Design</span>
      </p>
    </div>

    <span class="mhero__scroll" aria-hidden="true">Scroll</span>
  </section>

  <section class="mexhale">
    <p>
      Build a <em>beautiful business</em> that lets you live.
      Peaceful. Profitable. <em>Present.</em>
    </p>
  </section>

</body>
</html>
